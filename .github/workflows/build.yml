name: Private release build
run-name: private-build ${{ inputs.version }}
'on':
  workflow_dispatch:
    inputs:
      version:
        description: Upstream formal release version (vX.Y.Z)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: build-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.validate.outputs.version }}
      release-id: ${{ steps.prepare.outputs.release-id }}
      skip-build: ${{ steps.prepare.outputs.skip-build }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: validate
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
        run: python3 .github/scripts/build_failure.py validate
      - uses: actions/checkout@v4
        with:
          repository: NKU100/cc-switch-src
          ref: refs/tags/${{ steps.validate.outputs.version }}
          token: ${{ secrets.SRC_TOKEN }}
          persist-credentials: false
      - id: prepare
        uses: ./.github/actions/package
        with:
          mode: prepare
          version: ${{ steps.validate.outputs.version }}
          src-token: ${{ secrets.SRC_TOKEN }}
  windows-x64:
    needs: [prepare]
    if: needs.prepare.outputs.skip-build == 'false'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          repository: NKU100/cc-switch-src
          ref: refs/tags/${{ needs.prepare.outputs.version }}
          token: ${{ secrets.SRC_TOKEN }}
          persist-credentials: false
      - uses: ./.github/actions/package
        with:
          mode: package
          version: ${{ needs.prepare.outputs.version }}
          platform: windows-x64
          release-id: ${{ needs.prepare.outputs.release-id }}
          src-token: ${{ secrets.SRC_TOKEN }}
          updater-token: ${{ secrets.UPDATER_TOKEN }}
          updater-pubkey: ${{ vars.UPDATER_PUBKEY }}
          signing-private-key: ${{ secrets.SIGNING_PRIVATE_KEY }}
          signing-password: ${{ secrets.SIGNING_PASSWORD }}
  windows-arm64:
    needs: [prepare]
    if: needs.prepare.outputs.skip-build == 'false'
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
        with:
          repository: NKU100/cc-switch-src
          ref: refs/tags/${{ needs.prepare.outputs.version }}
          token: ${{ secrets.SRC_TOKEN }}
          persist-credentials: false
      - uses: ./.github/actions/package
        with:
          mode: package
          version: ${{ needs.prepare.outputs.version }}
          platform: windows-arm64
          release-id: ${{ needs.prepare.outputs.release-id }}
          src-token: ${{ secrets.SRC_TOKEN }}
          updater-token: ${{ secrets.UPDATER_TOKEN }}
          updater-pubkey: ${{ vars.UPDATER_PUBKEY }}
          signing-private-key: ${{ secrets.SIGNING_PRIVATE_KEY }}
          signing-password: ${{ secrets.SIGNING_PASSWORD }}
  linux-x64:
    needs: [prepare]
    if: needs.prepare.outputs.skip-build == 'false'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: NKU100/cc-switch-src
          ref: refs/tags/${{ needs.prepare.outputs.version }}
          token: ${{ secrets.SRC_TOKEN }}
          persist-credentials: false
      - uses: ./.github/actions/package
        with:
          mode: package
          version: ${{ needs.prepare.outputs.version }}
          platform: linux-x64
          release-id: ${{ needs.prepare.outputs.release-id }}
          src-token: ${{ secrets.SRC_TOKEN }}
          updater-token: ${{ secrets.UPDATER_TOKEN }}
          updater-pubkey: ${{ vars.UPDATER_PUBKEY }}
          signing-private-key: ${{ secrets.SIGNING_PRIVATE_KEY }}
          signing-password: ${{ secrets.SIGNING_PASSWORD }}
  linux-arm64:
    needs: [prepare]
    if: needs.prepare.outputs.skip-build == 'false'
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          repository: NKU100/cc-switch-src
          ref: refs/tags/${{ needs.prepare.outputs.version }}
          token: ${{ secrets.SRC_TOKEN }}
          persist-credentials: false
      - uses: ./.github/actions/package
        with:
          mode: package
          version: ${{ needs.prepare.outputs.version }}
          platform: linux-arm64
          release-id: ${{ needs.prepare.outputs.release-id }}
          src-token: ${{ secrets.SRC_TOKEN }}
          updater-token: ${{ secrets.UPDATER_TOKEN }}
          updater-pubkey: ${{ vars.UPDATER_PUBKEY }}
          signing-private-key: ${{ secrets.SIGNING_PRIVATE_KEY }}
          signing-password: ${{ secrets.SIGNING_PASSWORD }}
  macos-universal:
    needs: [prepare]
    if: needs.prepare.outputs.skip-build == 'false'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          repository: NKU100/cc-switch-src
          ref: refs/tags/${{ needs.prepare.outputs.version }}
          token: ${{ secrets.SRC_TOKEN }}
          persist-credentials: false
      - uses: ./.github/actions/package
        with:
          mode: package
          version: ${{ needs.prepare.outputs.version }}
          platform: macos-universal
          release-id: ${{ needs.prepare.outputs.release-id }}
          src-token: ${{ secrets.SRC_TOKEN }}
          updater-token: ${{ secrets.UPDATER_TOKEN }}
          updater-pubkey: ${{ vars.UPDATER_PUBKEY }}
          signing-private-key: ${{ secrets.SIGNING_PRIVATE_KEY }}
          signing-password: ${{ secrets.SIGNING_PASSWORD }}
  publish:
    needs: [prepare, windows-x64, windows-arm64, linux-x64, linux-arm64, macos-universal]
    if: >-
      always() && needs.prepare.result == 'success' &&
      (needs.prepare.outputs.skip-build == 'true' ||
      (needs.windows-x64.result == 'success' && needs.windows-arm64.result == 'success' &&
      needs.linux-x64.result == 'success' && needs.linux-arm64.result == 'success' &&
      needs.macos-universal.result == 'success'))
    runs-on: ubuntu-22.04
    concurrency:
      group: private-release-publication
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          repository: NKU100/cc-switch-src
          ref: refs/tags/${{ needs.prepare.outputs.version }}
          token: ${{ secrets.SRC_TOKEN }}
          persist-credentials: false
      - uses: ./.github/actions/package
        with:
          mode: publish
          version: ${{ needs.prepare.outputs.version }}
          release-id: ${{ needs.prepare.outputs.release-id }}
          src-token: ${{ secrets.SRC_TOKEN }}
      - uses: actions/checkout@v4
        with:
          repository: NKU100/cc-switch-build
          ref: ${{ github.event.repository.default_branch }}
          path: public-control
          token: ${{ github.token }}
          persist-credentials: true
      - id: keepalive
        working-directory: public-control
        env:
          BUILD_VERSION: ${{ needs.prepare.outputs.version }}
          PUBLIC_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set +x
          [[ "$BUILD_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git check-ref-format "refs/heads/$PUBLIC_DEFAULT_BRANCH" >/dev/null
          git fetch origin "$PUBLIC_DEFAULT_BRANCH" >/dev/null 2>&1
          git checkout -B "$PUBLIC_DEFAULT_BRANCH" "origin/$PUBLIC_DEFAULT_BRANCH" >/dev/null 2>&1
          if [[ -f last-built-version.txt ]]; then
            previous=$(cat last-built-version.txt)
            [[ "$previous" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            newest=$(printf '%s\n' "$previous" "$BUILD_VERSION" | sort -V | tail -n 1)
            if [[ "$newest" == "$previous" ]]; then exit 0; fi
          fi
          printf '%s\n' "$BUILD_VERSION" > last-built-version.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- last-built-version.txt
          git -c core.hooksPath=/dev/null commit -m "chore: record $BUILD_VERSION build" >/dev/null 2>&1
          git push origin "HEAD:refs/heads/$PUBLIC_DEFAULT_BRANCH" >/dev/null 2>&1
  failure:
    needs: [prepare, windows-x64, windows-arm64, linux-x64, linux-arm64, macos-universal, publish]
    if: >-
      always() && (needs.prepare.result != 'success' || needs.publish.result != 'success')
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: read
    concurrency:
      group: private-build-failure-marker
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v4
        with:
          repository: NKU100/cc-switch-build
          persist-credentials: false
      - env:
          PACKAGE_VERSION: ${{ inputs.version }}
          SRC_TOKEN: ${{ secrets.SRC_TOKEN }}
          PUBLIC_TOKEN: ${{ github.token }}
          PUBLIC_RUN_ID: ${{ github.run_id }}
        run: python3 .github/scripts/build_failure.py failure
