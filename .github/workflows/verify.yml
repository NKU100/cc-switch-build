name: Manual CI validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  control:
    name: Public release control tests
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Control script tests
        run: python3 -m unittest discover -s .github/scripts/tests
